apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-server

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-server

  template:
    metadata:
      labels:
        app: api-server

    spec:
      containers:
        - name: api-server

          image: 145023121102.dkr.ecr.ap-south-1.amazonaws.com/api:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: MODE
              valueFrom:
                configMapKeyRef:
                  name: lms-config
                  key: MODE

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: lms-config
                  key: PORT

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lms-secret
                  key: DATABASE_URL
