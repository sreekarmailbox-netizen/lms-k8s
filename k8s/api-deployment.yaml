apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-server

  template:
    metadata:
      labels:
        app: api-server

    spec:
      containers:
        - name: api-server
          image: 668855906895.dkr.ecr.ap-south-1.amazonaws.com/api:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: MODE
              value: "local"

            - name: PORT
              value: "3000"

            - name: DATABASE_URL
              value: "postgresql://postgres:admin123@local-db:5432/mydb"
