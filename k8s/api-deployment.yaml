apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-server

  template:
    metadata:
      labels:
        app: api-server

    spec:
      containers:
        - name: api-server
          image: lms-backend:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          env:
            - name: MODE
              value: "local"

            - name: PORT
              value: "3000"

            - name: DATABASE_URL
              value: "postgresql://postgres:admin123@local-db:5432/mydb"
