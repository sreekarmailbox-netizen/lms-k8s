apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-server

spec:
  replicas: 1

  selector:
    matchLabels:
      app: web-server

  template:
    metadata:
      labels:
        app: web-server

    spec:
      containers:
        - name: web-server

          image: lms-web:1.0

          imagePullPolicy: Never

          ports:
            - containerPort: 80
